<!DOCTYPE html>

<html lang="en">

<head>
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="https://use.typekit.net/yux0hjt.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taneli's Portfolio </title>

  <style>

    /* =========================
       GLOBAL STYLES
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica", Arial, sans-serif;
      background: rgb(81, 57, 39);
      color: #faec9d;
      padding: 50px;
      overflow-x: hidden;
    }

    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #faec9d;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 160ms ease, height 160ms ease;
    }

    @media (pointer: coarse) {
      .cursor-dot {
        display: none;
      }
    }

    @media (pointer: fine) {
      body,
      body * {
        cursor: none;
      }
    }

    /* =========================
       TYPOGRAPHY
       FONT STYLE GUIDE
    ========================= */

    /* Title — 60px Helvetica Bold */
    .title {
      font-family: "helvetica neue", "helvetica", Arial, sans-serif;
      font-size: 60px;
      font-weight: 700;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* Heading 1 — 40px Helvetica */
    h1 {
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 40px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 10px;
    }

    /* Heading 2 — 32px pressato-variable */
    h2 {
      font-family: "pressato-variable", sans-serif;
      font-variation-settings: 'wdth' 218, 'wght' 263, 'slnt' 120;
      font-size: 32px;
      font-weight: 400;
    }

    /* Heading 3 — 28px Helvetica Italic */
    h3 {
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 28px;
      font-style: italic;
      font-weight: 400;
    }

    /* Body — 20px Helvetica Thin */
    p,
    li {
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 20px;
      font-weight: 300;
    }

    /* =========================
       LINKS
    ========================= */

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #faec9d;
      text-decoration: underline;
    }

    /* =========================
       TEXT SELECTION
    ========================= */

    p::selection {
      color: pink;
      background-color: green;
    }

    /* =========================
       HEADER
    ========================= */

    .subtitle {
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 20px;
      font-weight: 300;
      text-align: center;
      color: #777;
      margin-bottom: 50px;
    }

    .top-left-nav {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      font-size: 16px;
      line-height: 1.1;
    }

    .top-left-nav a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .top-left-nav a:hover,
    .top-left-nav a:focus-visible {
      color: #faec9d;
    }

    /* =========================
       SITEMAP
    ========================= */

    .sitemap {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        flex-direction: column;
        max-width: 1200px;
        gap: 20px 40px;
        align-items: center;
        margin: auto;
    }

    /* =========================
        PORTFOLIO
    ========================= */

    .portfolio {
      width: 100%;
      margin: 80px auto 20px;
      padding: 25px;
      border: none;
      color: #faec9d;
      text-align: center;
      border-radius: 60px;

      font-family: "pressato-variable", sans-serif;
      font-variation-settings: 'wdth' 218, 'wght' 263, 'slnt' 78;
      font-size: clamp(56px, 10vw, 180px);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      transition: font-variation-settings 400ms ease;
    }

    .portfolio:hover,
    .portfolio:focus-visible {
      font-variation-settings: 'wdth' 218, 'wght' 263, 'slnt' -80;
    }

    .portfolio-hover-label {
      display: none;
    }

    .portfolio:hover .portfolio-default-label,
    .portfolio:focus-visible .portfolio-default-label {
      display: none;
    }

    .portfolio:hover .portfolio-hover-label,
    .portfolio:focus-visible .portfolio-hover-label {
      display: inline;
    }



    /* =========================
       MAIN NAVIGATION
    ========================= */

    .main-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      position: relative;
    }

    /* Horizontal line */

    .main-nav::before {
      content: "";
      position: absolute;
      height: 2px;
      background: #faec9d;
      top: -30px;
      left: 10%;
      right: 10%;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      background: transparent;
      border: 2px solid #faec9d;
      border-radius: 12px;
      padding: 20px;
      min-height: 180px;
      position: relative;
      color: #faec9d;
    }

    /* Section headings — H2 */

    .section h2 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 15px;
    }

    /* Section list */

    .section ul {
      list-style: none;
    }

    .section li {
      padding: 7px 0;
      color: #faec9d;

      /* Body typography */
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 20px;
      font-weight: 300;

      border-bottom: 1px solid rgba(250, 236, 157, 0.45);
    }

    .section li:last-child {
      border-bottom: none;
    }

    /* =========================
       DESCRIPTION
    ========================= */

    

    .description h2 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 15px;
    }

    .description p {
      font-family: "Helvetica", Arial, sans-serif;
      font-size: 20px;
      font-weight: 300;
      color: #faec9d;
      opacity: 0.9;
      line-height: 1.2;
    }

    /* =========================
       RESPONSIVE DESIGN
    ========================= */

    @media (max-width: 900px) {

      .main-nav {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 600px) {

      body {
        padding: 25px;
      }

      .main-nav {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: var(--font-size-h1);
      }

      .title {
        font-size: clamp(32px, 9vw, 60px);
      }

    }

    @media (max-width: 600px) {
      body {
        padding: 24px 18px;
      }

      .top-left-nav {
        top: 16px;
        left: 18px;
        font-size: 14px;
      }

      .sitemap {
        width: 100%;
      }

      .title {
        margin-top: 70px;
      }

      .portfolio {
        padding: 12px 0;
        margin-top: 48px;
        font-size: clamp(42px, 14vw, 90px);
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .description p {
        font-size: 16px;
      }
    }

  </style>

</head>


<body>

  <div class="cursor-dot" aria-hidden="true"></div>

  <nav class="top-left-nav" aria-label="Main navigation">
    <a href="work.html">Work</a>
    <a href="about.html">About Me</a>
    <a href="CONTACT.HTML">Contact</a>
  </nav>



  <!-- PORTFOLIO -->
  <div class="portfolio" tabindex="0" aria-label="Taneli's">
    <span class="portfolio-default-label">PORTFOLIO</span>
    <span class="portfolio-hover-label">TANELI'S</span>
  </div>
<script>
  const cursorDot = document.querySelector('.cursor-dot');

  window.addEventListener('pointermove', (event) => {
    cursorDot.style.left = `${event.clientX}px`;
    cursorDot.style.top = `${event.clientY}px`;
  });
</script>
</body>
</html>
